name: Release

on:
  push:
    tags:
      - 'v*'
  # Run from main, so a fixed workflow needs no new tag:
  #   -f tag=vX.Y.Z                  builds that tag again and publishes it (every step can repeat)
  #   -f tag=main -f publish=false   builds every target only, before tagging
  workflow_dispatch:
    inputs:
      tag:
        description: Tag (or branch, without publishing) to build
        required: true
      publish:
        description: Publish the release, the image and the crate
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Changelog has the release
        if: env.PUBLISH == 'true'
        run: |
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no section for $TAG: run scripts/changelog.py release"; exit 1; }
      - name: Tag matches Cargo.toml
        if: env.PUBLISH == 'true'
        run: |
          CRATE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$CRATE" = "$TAG" || { echo "tag $TAG but Cargo.toml says $CRATE"; exit 1; }

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY="target/${{ matrix.target }}/release/satex"
          strip "$BINARY" || true

      - name: Get version
        id: version
        run: |
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BINARY="target/${{ matrix.target }}/release/satex"
          PACKAGE="satex-${VERSION}-${{ matrix.target }}"
          mkdir -p "$PACKAGE"
          cp "$BINARY" "$PACKAGE/"
          cp README.md "$PACKAGE/" || true
          cp SEMANTICS.md "$PACKAGE/" || true
          cp LICENSE "$PACKAGE/" || true
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          rm -rf "$PACKAGE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $BINARY = "target/${{ matrix.target }}/release/satex.exe"
          $PACKAGE = "satex-${VERSION}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "$PACKAGE" -Force
          Copy-Item "$BINARY" "$PACKAGE/"
          Copy-Item "README.md" "$PACKAGE/" -ErrorAction SilentlyContinue
          Copy-Item "SEMANTICS.md" "$PACKAGE/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "$PACKAGE/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$PACKAGE" -DestinationPath "${PACKAGE}.zip"
          Remove-Item -Recurse "$PACKAGE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satex-${{ matrix.target }}
          path: |
            satex-*-${{ matrix.target }}.tar.gz
            satex-*-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # Only the binaries: the container job's build record (`*.dockerbuild`) does not extract.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: satex-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Release notes
        id: notes
        run: |
          VERSION="${TAG#v}"
          if [ -f "doc/release-notes/$VERSION.md" ]; then
            echo "path=doc/release-notes/$VERSION.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          overwrite_files: true
          prerelease: ${{ contains(env.TAG, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}

      # A release made with this token starts no `release` workflow: only a dispatch does.
      - name: Benchmark the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bench.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG" -f version="$TAG"

      # The site names the released version; github-pages deploys from main only.
      - name: Refresh the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  # The container image (Dockerfile) on GHCR: `ghcr.io/<owner>/satex:<version>`, `latest` for a final release.
  docker:
    name: Publish the container image
    needs: check
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # GHCR takes lowercase names only.
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/satex" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}

      # No build record artifact: the release job downloads artifacts, and the record is no zip.
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  crate:
    name: Publish to crates.io
    needs: release
    if: ${{ !contains(inputs.tag || github.ref_name, '-') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      # A repeated run finds the version published and stops (crates.io never takes it twice).
      - name: Already on crates.io
        id: published
        run: |
          CRATE=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl -sf -A "$GITHUB_REPOSITORY release" "https://crates.io/api/v1/crates/$CRATE/${TAG#v}" > /dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.published.outputs.yes != 'true'
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.yes != 'true'
        id: auth
      - name: Publish
        if: steps.published.outputs.yes != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
