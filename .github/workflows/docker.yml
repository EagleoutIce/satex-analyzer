name: Docker

# Builds the container image when the Dockerfile changes, without pushing it.
# release.yml publishes it on a release tag.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: satex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm satex:ci --version
          mkdir -p smoke
          printf '%s\n' '\documentclass{article}' '\begin{document}' 'Hello.' '\end{document}' > smoke/main.tex
          docker run --rm -v "$PWD/smoke:/work" satex:ci lint
