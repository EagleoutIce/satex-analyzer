name: CI

# A pull request used to run twice, once for the push and once for itself.
on:
  push:
    branches: [main]
  pull_request:
  # The full tier: several TeX Live versions and the exhaustive compliance
  # cross product.  Too slow for every push, so it runs at release time, and
  # workflow_dispatch lets it be run by hand without cutting a release.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A new push replaces the running run of the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Which job groups the change concerns (scripts/ci-changes.sh), so a
  # change to, say, the VS Code extension alone runs no Rust tests.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      links: ${{ steps.detect.outputs.links }}
      citations: ${{ steps.detect.outputs.citations }}
      tree: ${{ steps.detect.outputs.tree }}
    steps:
      # A pull request checks out its merge commit, whose first parent is
      # the base; a push is compared with the commit it replaced.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base=
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) git fetch --depth=1 origin "$BEFORE" && base=$BEFORE || true ;;
          esac
          scripts/ci-changes.sh "$base" > changes
          # A tree a same-repository pull request already passed is not tested again.
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          passed=0
          if [[ "$EVENT" == push ]]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree" \
              --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' || echo 0)
          fi
          if (( passed > 0 )); then
            echo "tree $tree already passed" >&2
            printf 'rust=false\nlinks=false\ncitations=false\n' > changes
          fi
          tee -a "$GITHUB_OUTPUT" < changes

  # Quick tier: every push and pull request, current TeX Live only.
  quick-linux:
    name: Test ubuntu-latest (${{ matrix.shard }})
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Shards take 15 to 30 minutes on a busy runner; the limit is there to
    # stop a hang, not a slow day.
    timeout-minutes: 45
    # The TeX Live image already holds a full installation, which the
    # engine-dependent tests need; installing one with apt takes minutes.
    container: texlive/texlive:latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8', compliance]
    steps:
      # Lua and LPeg are compiled from C; the TeX Live image has no compiler.
      - name: Install a C toolchain
        run: apt-get update && apt-get install -y --no-install-recommends build-essential

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for every shard: they build the same dependencies.
          shared-key: quick-linux
          save-if: ${{ matrix.shard == '1/8' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # Fails in seconds if the image ever stops shipping TeX, which would
      # otherwise turn the whole engine suite into silent no-ops.
      - name: The distribution is really there
        run: kpsewhich latex.ltx

      - name: Test
        if: matrix.shard != 'compliance'
        env:
          SATEX_REQUIRE_TEX: '1'
        run: bash scripts/ci-test.sh ${{ matrix.shard }}

      - name: Unit tests
        if: matrix.shard == 'compliance'
        env:
          SATEX_REQUIRE_TEX: '1'
        run: bash scripts/ci-test.sh lib

      # The known-divergence ledger: fails on purpose while any of its ~61
      # entries is open.  Reported here as its own shard, non-blocking, so
      # the count is visible on every run without turning the job red.
      - name: Compliance ledger (known-red, non-blocking)
        if: matrix.shard == 'compliance'
        continue-on-error: true
        env:
          SATEX_REQUIRE_TEX: '1'
        run: bash scripts/ci-test.sh compliance

  quick-other:
    name: Test ${{ matrix.os }}
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # Usually 20 minutes; room for a slow runner.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # scheme-basic is the smallest tree with a real LaTeX in it, and it
      # carries pdfTeX, XeTeX and LuaTeX: what the engine-dependent tests
      # drive.  A bigger scheme buys packages, not platform coverage; the
      # few the modules below load are named one by one.
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            pgf
            beamer
            microtype
            luacode
            luatexbase
            iftex
            xcolor
            translator
            etoolbox
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quick-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: The distribution is really there
        shell: bash
        run: kpsewhich latex.ltx

      # .gitattributes keeps text files LF; a CRLF checkout broke the Lua
      # tests here once, so fail early and say why if it ever comes back.
      - name: The checkout has LF line ends
        shell: bash
        run: |
          if git ls-files --eol | grep 'w/crlf'; then
            echo "files checked out with CRLF line ends (see .gitattributes)" >&2
            exit 1
          fi

      # Most other modules assume a LaTeX kernel without saying so and fail
      # rather than skip when scheme-basic is missing a package; these are
      # the ones that either need no distribution or only what scheme-basic
      # carries, plus the four the brief calls out by name.
      # `distribution_guard::` reports what is left out of this list.
      #
      # All integration tests build into one `it` binary; libtest filters
      # (`module::`) pick the modules, and `--lib` runs unfiltered so it
      # needs its own invocation.
      - name: Test
        shell: bash
        env:
          SATEX_REQUIRE_TEX: '1'
        run: |
          cargo test --locked --profile ci --no-fail-fast --lib
          cargo test --locked --profile ci --no-fail-fast --test it -- \
            distribution_guard:: \
            engine:: \
            engine_truth:: \
            differential:: \
            engine_trace:: \
            format_flags:: \
            lua:: \
            no_hang:: \
            no_installation:: \
            paths:: \
            positions:: \
            primitives:: \
            termination:: \
            tex_compliance:: \
            trace_range::

      - name: Compliance ledger (known-red, non-blocking)
        shell: bash
        continue-on-error: true
        env:
          SATEX_REQUIRE_TEX: '1'
        run: cargo test --locked --profile ci --no-fail-fast --test it -- 'compliance_matrix::'

  passed:
    name: Mark the tree as passed
    needs: [changes, quick-linux, quick-other, lint]
    if: >-
      always() && needs.changes.outputs.rust == 'true' &&
      needs.quick-linux.result == 'success' && needs.quick-other.result == 'success' && needs.lint.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "${{ github.sha }}" > passed
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ needs.changes.outputs.tree }}
          path: passed
          retention-days: 30

  # Release tier: older TeX Live versions and the full compliance cross product.
  full-linux:
    name: Full ubuntu-latest ${{ matrix.tl }} (${{ matrix.shard }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # Prebuilt images: an install would cost minutes per cell, a pull
        # costs seconds.  Historic images are maintained monthly, so these
        # tags stay resolvable.  Three versions, spanning current down to
        # an install base several years old.
        tl: [current, TL2022, TL2019]
        include:
          - tl: current
            container: texlive/texlive:latest
          - tl: TL2022
            container: texlive/texlive:TL2022-historic
          - tl: TL2019
            container: texlive/texlive:TL2019-historic
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8', compliance]
    steps:
      - name: Install a C toolchain
        run: apt-get update && apt-get install -y --no-install-recommends build-essential

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Rust build products do not depend on the TeX Live version, so
          # every version shares one cache.
          shared-key: full-linux
          save-if: ${{ matrix.tl == 'current' && matrix.shard == '1/8' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: The distribution is really there
        run: kpsewhich latex.ltx

      - name: Test
        if: matrix.shard != 'compliance'
        env:
          SATEX_REQUIRE_TEX: '1'
        run: bash scripts/ci-test.sh ${{ matrix.shard }}

      - name: Unit tests
        if: matrix.shard == 'compliance'
        env:
          SATEX_REQUIRE_TEX: '1'
        run: bash scripts/ci-test.sh lib

      # Default (~11s) on every version, for visibility of version-specific
      # divergences.  The full cross product (~90s) only on the current
      # version, per the brief: exactly one cell carries it.
      - name: Compliance ledger, default (known-red, non-blocking)
        if: matrix.shard == 'compliance' && matrix.tl != 'current'
        continue-on-error: true
        env:
          SATEX_REQUIRE_TEX: '1'
        run: bash scripts/ci-test.sh compliance

      - name: Compliance ledger, full cross product (known-red, non-blocking)
        if: matrix.shard == 'compliance' && matrix.tl == 'current'
        continue-on-error: true
        env:
          SATEX_REQUIRE_TEX: '1'
          SATEX_COMPLIANCE: full
        run: bash scripts/ci-test.sh compliance

  full-other:
    name: Full ${{ matrix.os }} (current)
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: scheme-basic
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: The distribution is really there
        shell: bash
        run: kpsewhich latex.ltx

      - name: The checkout has LF line ends
        shell: bash
        run: |
          if git ls-files --eol | grep 'w/crlf'; then
            echo "files checked out with CRLF line ends (see .gitattributes)" >&2
            exit 1
          fi

      - name: Test
        shell: bash
        env:
          SATEX_REQUIRE_TEX: '1'
        run: |
          cargo test --locked --profile ci --no-fail-fast --lib
          cargo test --locked --profile ci --no-fail-fast --test it -- \
            distribution_guard:: \
            engine:: \
            engine_truth:: \
            differential:: \
            engine_trace:: \
            format_flags:: \
            lua:: \
            no_hang:: \
            no_installation:: \
            paths:: \
            positions:: \
            primitives:: \
            termination:: \
            tex_compliance:: \
            trace_range::

      - name: Compliance ledger (known-red, non-blocking)
        shell: bash
        continue-on-error: true
        env:
          SATEX_REQUIRE_TEX: '1'
        run: cargo test --locked --profile ci --no-fail-fast --test it -- 'compliance_matrix::'

  lint:
    name: Lint ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # Pinned: `-D warnings` on a floating toolchain fails the day clippy
      # grows a lint, on a commit that changed nothing.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      # Before the cache, so a formatting slip is reported in seconds.  One
      # runner is enough: the source is the same on all three.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # `#[cfg(windows)]` code is only compiled on Windows, so a Linux-only
      # clippy never sees it fail to build.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  link-check:
    name: Check documentation links
    needs: changes
    if: needs.changes.outputs.links == 'true'
    runs-on: ubuntu-latest
    # Usually two minutes, but slow hosts plus lychee's retries have taken
    # fourteen.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Lychee
        uses: lycheeverse/lychee-action@v2
        env:
          # Raises GitHub's anonymous API rate limit, which the many
          # github.com/.../blob/<sha>/...#L<line> citations would otherwise hit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Links into this repository's `main` are checked against the
          # checkout, and CTAN's mirror redirector against one fixed mirror
          # (see lychee.toml).
          args: >-
            --config lychee.toml
            --no-progress
            --remap 'https://github\.com/EagleoutIce/satex-analyzer/blob/main/([^#]*)(#.*)? file://${{ github.workspace }}/$1'
            --remap '^https://mirrors\.ctan\.org/(.*)$ https://ctan.net/$1'
            *.md
            doc/**/*.md
          fail: true

  # A `tex.web § N` / `etex.ch \`identifier\`` citation names a module number
  # or an identifier, never a line, so this re-resolves every one against the
  # *current* upstream commit (`satex-doc --check-citations`, in
  # src/bin/satex-doc.rs) and fails if a citation no longer resolves at all,
  # or now resolves to a different line than what is checked in
  # (doc/src/tex-web-sections.tsv, doc/src/tex-web-sha.txt, SEMANTICS.md).
  citation-drift:
    name: Check citations against upstream
    needs: changes
    if: needs.changes.outputs.citations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: citation-drift
          cache-on-failure: true

      - name: Build satex-doc
        run: cargo build --locked --profile ci --features doc --bin satex-doc

      - name: Check citations against the live upstream commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: target/ci/satex-doc --check-citations
