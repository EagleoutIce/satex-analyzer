name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      # Lua and LPeg are compiled from C; the TeX Live image has no compiler.
      - name: Install a C toolchain
        run: apt-get update && apt-get install -y --no-install-recommends build-essential

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate the documentation
        run: |
          cargo build --release
          cargo run --release --features doc --bin satex-doc

      - name: Collect the site
        run: |
          mkdir -p site/doc
          cp README.md site/index.md
          cp SEMANTICS.md site/
          cp -r doc/wiki site/wiki
          cp -r doc/wiki site/doc/wiki
          cp doc/chktex-coverage.md site/
          cp doc/chktex-coverage.md site/doc/
          # A project page is served under /<repository>, which the theme's
          # own asset links follow through `baseurl`.
          cat > site/_config.yml <<YAML
          theme: jekyll-theme-cayman
          title: satex
          description: An abstract interpreter for TeX and LaTeX
          baseurl: /${{ github.event.repository.name }}
          YAML
          find site -name '*.md' -print0 | while IFS= read -r -d '' page; do
            printf '---\nlayout: default\n---\n' | cat - "$page" > "$page.tmp"
            mv "$page.tmp" "$page"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: site-sources
          path: site

  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-sources
          path: site

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
