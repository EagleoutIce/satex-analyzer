name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      # Lua and LPeg are compiled from C; pandoc renders the Markdown,
      # pdftocairo turns the logo into SVG.
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git xz-utils ca-certificates python3 pandoc poppler-utils

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      # Compiles Lua for the browser; see `.cargo/config.toml`.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the documentation
        run: |
          cargo build --release
          cargo run --release --features doc --bin satex-doc

      - name: Build satex for the browser
        run: cargo build --release --target wasm32-unknown-emscripten --bin satex

      - name: Build the site
        run: python3 doc/site/build.py --satex target/release/satex --wasm target/wasm32-unknown-emscripten/release --out site

      - name: Test the playground
        run: |
          python3 -m http.server -d site 8000 > /dev/null 2>&1 &
          sleep 2
          node doc/site/test.mjs http://localhost:8000/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
