name: Pages

# The site (documentation and playground) follows `main`, like the wiki;
# a change that touches neither satex nor the site leaves it as it is.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'editors/**'
      - 'tests/**'
      - 'benches/**'
      - 'scripts/ci-*.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/vscode.yml'
      - '.github/workflows/wiki.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Beside `generate`, which picks it up when the playground needs it.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compiles Lua for the browser; see `.cargo/config.toml`.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
          actions-cache-folder: emsdk-cache
      - run: cargo build --locked --release --target wasm32-unknown-emscripten --bin satex
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            target/wasm32-unknown-emscripten/release/satex.js
            target/wasm32-unknown-emscripten/release/satex.wasm
          retention-days: 1

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    container: texlive/texlive:latest
    steps:
      # Lua and LPeg are compiled from C; pandoc renders the Markdown,
      # pdftocairo turns the logo into SVG, the encoders make the showcase's AVIF, WebP and MP4.
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git xz-utils ca-certificates python3 pandoc poppler-utils curl ffmpeg webp libavif-bin

      # The semantics pages export the Lean declarations; lake fetches the pinned toolchain.
      - name: Install Lean
        # GitHub's downloads answer 504 now and then.
        run: |
          for wait in 15 60 120 0; do
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && break
            [ "$wait" != 0 ] || exit 1
            sleep "$wait"
          done

      # With the tags: build.py stars the version when what the site ships differs from the release's tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The checkout belongs to another user than the container's root: git refuses it otherwise.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check the site's scripts
        run: |
          npx --yes -p typescript@5.9.3 tsc -p doc/site/tsconfig.json
          npx --yes -p typescript@5.9.3 tsc -p doc/site/jsconfig.json
          npx --yes -p typescript@5.9.3 tsc -p doc/site/tsconfig.worker.json

      # build.py keys its memo by the analysis, so stale entries are ignored.
      # Saved even when the build fails or runs out of time: the next run goes on from there.
      - uses: actions/cache/restore@v4
        with:
          path: site-work
          key: site-work-${{ github.sha }}
          restore-keys: site-work-

      - name: Build satex
        run: cargo build --locked --profile ci --features doc --bin satex --bin satex-doc

      # Failing, the checked-in pages are used.
      - name: Generate the documentation
        timeout-minutes: 10
        continue-on-error: true
        run: target/ci/satex-doc

      - name: Build the site
        timeout-minutes: 100
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SATEX_WASM_READY: wasm.ready
        run: |
          python3 scripts/ci-await-artifact.py wasm wasm wasm-build wasm.ready &
          python3 doc/site/build.py --satex target/ci/satex --wasm wasm-build --work site-work --out site

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: site-work
          key: site-work-${{ github.sha }}

      # Late or failing, the site still deploys.
      - name: Test the playground
        timeout-minutes: 8
        continue-on-error: true
        run: |
          python3 -m http.server -d site 8000 > /dev/null 2>&1 &
          sleep 2
          node doc/site/views.test.mjs
          node doc/site/worker.test.mjs
          node doc/site/test.mjs http://localhost:8000/

      # Switches, typing and undo storms, a killed worker, failing downloads, two tabs: no hang, no stale view.
      - name: Stress the playground
        timeout-minutes: 30
        continue-on-error: true
        run: node doc/site/chaos.mjs http://localhost:8000/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
