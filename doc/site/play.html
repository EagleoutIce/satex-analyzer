<div class="play-tools">
  <label class="kernel" title="the TeX engine and format">Kernel <select id="play-kernel" aria-label="kernel"></select></label>
  <label class="cmd"><span>$ satex</span><input id="play-args" value="lint" spellcheck="false" autocomplete="off" aria-label="satex command" aria-controls="play-complete"
    title="lint, explain \cmd, query …, rename NAME, fix [rule]. Tab completes, Enter runs, Up and Down go through earlier commands."><ul id="play-complete" class="complete" role="listbox" hidden></ul></label>
  <button id="play-run" disabled title="run the command (Enter)">Loading…</button>
  <span class="right">
    <span class="menu-wrap"><button id="play-upload" class="ghost" type="button" aria-haspopup="menu" title="add files, a folder or a .zip to the project">Upload</button>
      <span id="play-upmenu" class="ctx" role="menu" hidden><button role="menuitem" data-pick="files">Files or .zip…</button><button role="menuitem" data-pick="folder">Folder…</button></span></span>
    <input id="play-files" type="file" multiple hidden><input id="play-folder" type="file" webkitdirectory multiple hidden>
    <button id="play-link" class="ghost" type="button" title="a link that restores this text, file, command and kernel">Copy link</button>
  </span>
</div>
<div class="play-split">
  <section class="pane">
    <div class="filebar"><div class="tabs" role="tablist" id="play-tabs" aria-label="files"></div>
      <label id="play-rootbox" hidden>root <select id="play-root" aria-label="root document"></select></label></div>
    <div id="play-editor" class="editor"><textarea id="play-source" spellcheck="false" aria-label="LaTeX source"></textarea></div>
  </section>
  <div class="divider" id="play-divider" role="separator" aria-orientation="vertical" aria-label="resize panes: drag to the edge to fold a pane, click to bring it back" aria-valuemin="0" aria-valuemax="100" tabindex="0" title="drag to resize, to an edge to fold; click a folded one to unfold; double-click: half"></div>
  <section class="pane side-pane">
    <details open class="sect" id="play-findings"><summary>Findings <b id="lsp-count"></b> <span class="muted" id="lsp-status">language server: starting…</span></summary>
      <div id="play-refs" class="refs" hidden></div>
      <ul id="lsp-diagnostics" class="diagnostics grow" aria-live="polite"></ul></details>
    <details open class="sect" id="play-explain"><summary>Explain macro <code id="explain-name"></code></summary>
      <div id="explain-body" class="hover grow"><p class="muted">Put the cursor on a command.</p></div></details>
    <details class="sect" id="play-typeset"><summary>Typeset</summary>
      <div id="typeset-body" class="typeset grow"><p class="muted">What the paragraphs of the open file set, once it is checked.</p></div></details>
    <details class="sect" id="play-out" hidden><summary>Output <code id="play-cmd">satex lint</code></summary><div id="play-output" class="output grow"></div></details>
    <div class="statusbar" aria-live="polite"><progress id="play-progress" max="1" value="0" aria-label="loading"></progress><span id="play-status">Fetching satex and the TeX bundle…</span><span id="t-init"></span><span id="t-check"></span><span id="t-stats" class="muted"></span></div>
  </section>
</div>
<ul id="play-ctx" class="ctx" role="menu" hidden></ul>
<div id="play-toast" class="toast" role="status"></div>
<div id="play-drop" class="drop" hidden>Drop files, a folder or a .zip</div>
<script id="satex-play" type="application/json">{{manifest}}</script>
<script src="{{root}}{{playjs}}" defer></script>
