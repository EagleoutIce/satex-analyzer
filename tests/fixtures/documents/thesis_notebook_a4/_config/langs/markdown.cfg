\lstdefinelanguage{lMarkdown}{
number suffixes={},
alsoletter={|~_><-},
moredelim=**[is][{\xlsthlwarning}]{|warn|}{|warn|},
moredelim=**[is][{\xlsthlerror}]{|err|}{|err|},
moredelim=**[il][{\xlsthlerror}]{|err|:},
moredelim=**[is][{\xlsthlinfo}]{|info|}{|info|},
moredelim=**[is][{\itshape}]{|it|}{|it|},
moredelim=[is][{}]{|plain|}{|plain|},
moredelim=**[il][{\color{black}\bfseries}]{>imp>},
moredelim=**[s][{\xlstGetStyle{keywordA}\ttfamily}]{`}{`},
moredelim=**[s][\bfseries]{**}{**},
morecomment=[l]{\#},
commentstyle=\xlstGetStyle{numbers},
escapeinside={!*}{*!},
morestring=[s]''
}

\RegisterLanguage[md]{markdown}{lMarkdown}